name: Build network rules

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

concurrency:
  group: network-rules-publish
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build and validate the candidate
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python tools/network_rules.py build --repository "$REPOSITORY"
          python tools/network_rules.py check dist | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish validated files
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="$(git ls-remote --heads origin refs/heads/publish)"
          publish_dir="$RUNNER_TEMP/network-rules-publish"
          if [[ -n "$branch" ]]; then
            git fetch --no-tags origin refs/heads/publish
            git worktree add --detach "$publish_dir" FETCH_HEAD
            python tools/network_rules.py diff "$publish_dir" dist --gate | tee -a "$GITHUB_STEP_SUMMARY"
            if diff -qr --exclude=manifest.json dist/v1 "$publish_dir/v1" &&
              cmp -s <(jq -S '.categories' dist/v1/manifest.json) \
                <(jq -S '.categories' "$publish_dir/v1/manifest.json"); then
              echo "Published artifacts are current." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan publish
          fi

          rm -rf "$publish_dir/v1"
          cp -R dist/v1 "$publish_dir/v1"
          git -C "$publish_dir" add -A
          git -C "$publish_dir" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Publish verified network rules"
          commit="$(git -C "$publish_dir" rev-parse HEAD)"
          git -C "$publish_dir" push origin HEAD:refs/heads/publish
          curl -fsS --retry 5 --retry-all-errors --max-time 20 \
            "https://raw.githubusercontent.com/$REPOSITORY/$commit/v1/manifest.json" \
            -o "$RUNNER_TEMP/published-manifest.json"
          cmp dist/v1/manifest.json "$RUNNER_TEMP/published-manifest.json"
