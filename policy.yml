# Order keeps explicit service and DIRECT policies above broad fallbacks.
homeproxy_rule_set_version: 2
nextin_fallback: 节点选择
nextin_routing:
  auto_filters:
    通用分流:
      exclude-filter: '(?i)(?<![a-z0-9])(?:[x×][ \t]*[0-9]+(?:[.．][0-9]+)?|[0-9]+(?:[.．][0-9]+)?[ \t]*[x×])(?![a-z0-9])'
    AppleTV:
      filter: '(?i)美国|美國|🇺🇸|united[ _-]+states|(?<![a-z0-9])usa?[0-9]*(?![a-z0-9])'
    OpenAI:
      filter: '(?i)^(?=.*(?:美国|美國|🇺🇸|united[ _-]+states|新加坡|狮城|獅城|🇸🇬|singapore|(?<![a-z0-9])(?:usa?|sg)[0-9]*(?![a-z0-9])))(?=.*(?<![a-z0-9])ai[0-9]*(?![a-z0-9]))'
  groups:
    Apple: [DIRECT, 通用分流]
    漏网之鱼: [DIRECT, 通用分流]
  before:
    - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
    - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
    - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
    - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
    - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
    - IP-CIDR6,fc00::/7,DIRECT,no-resolve
    - IP-CIDR6,fe80::/10,DIRECT,no-resolve
    - DOMAIN-SUFFIX,local,DIRECT
  categories:
    pt: DIRECT
    personal-sites: DIRECT
    adblock-dns: REJECT
    binance: 通用分流
    openai: OpenAI
    apple-tv: AppleTV
    gfw: 通用分流
    google: 通用分流
    apple: Apple
    china-sites: DIRECT
  after:
    - GEOIP,CN,DIRECT
    - MATCH,漏网之鱼
categories:
  - id: application-cleanup
    dlc: []
    quanx_legacy: Rules/Advertising/Hijacking.list
    policies: {quanx: REJECT}
  - id: pt
    dlc: category-pt
    quanx_legacy: Rules/PT.list
    quanx_compat: rule/QuantumultX/PrivateTracker/PrivateTracker.list
    quanx_merge_compat: true
    nextin_import_quanx: true
    policies: {openclash: DIRECT, quanx: DIRECT, homeproxy: direct, nextin: DIRECT}
  - id: personal-sites
    dlc: []
    quanx_legacy: Rules/MySelf.list
    nextin_import_quanx: true
    nextin_default: false
    policies: {quanx: DIRECT, nextin: DIRECT}
  - id: adblock-dns
    adblock_dns: true
    nextin_default: false
    policies: {nextin: REJECT}
  - id: tiktok
    dlc: tiktok
    quanx_compat: rule/QuantumultX/TikTok/TikTok.list
    policies: {openclash: TikTok, quanx: TikTok, homeproxy: TikTok, nextin: 节点选择}
  - id: binance
    dlc: binance
    quanx_legacy: Rules/Binance.list
    policies: {openclash: 自动选择, quanx: 自动选择, homeproxy: 自动选择, nextin: 节点选择}
  - id: openai
    dlc: openai
    policies: {openclash: OpenAI, quanx: OpenAI, homeproxy: OpenAI, nextin: 节点选择}
  - id: github
    dlc: github
    policies: {openclash: GitHub, quanx: GitHub, homeproxy: GitHub, nextin: 节点选择}
  - id: youtube
    dlc: youtube
    policies: {openclash: YouTube, quanx: Youtube, homeproxy: YouTube, nextin: 节点选择}
  - id: disney-plus
    dlc: disney
    quanx_legacy: Rules/Media/Foreign/DisneyPlus.list
    enabled: false
    policies: {openclash: DisneyPlus, quanx: DisneyPlus, homeproxy: DisneyPlus, nextin: 节点选择}
  - id: telegram
    dlc: telegram
    quanx_legacy: Rules/Services/SNS/Telegram.list
    policies: {openclash: Telegram, quanx: Telegram, homeproxy: Telegram, nextin: 节点选择}
  - id: foreign-media
    # Services common to the ProxyMedia and ForeignMedia profiles.
    dlc: [abema, apple-tvplus, bahamut, bbc, dazn, disney, hbo, hulu, netflix, primevideo, spotify, twitch]
    quanx_legacy: Rules/Media/ForeignMedia.list
    policies: {openclash: 国外媒体, quanx: 国外媒体, homeproxy: 国外媒体, nextin: 节点选择}
  - id: google
    dlc: google
    quanx_legacy: Rules/Services/Google.list
    policies: {openclash: 自动选择, quanx: 自动选择, homeproxy: 自动选择, nextin: 节点选择}
  - id: apple
    dlc: apple
    quanx_legacy: Rules/Services/Apple.list
    policies: {openclash: Apple, quanx: Apple, homeproxy: Apple, nextin: 节点选择}
  - id: gfw
    gfwlist: true
    nextin_default: false
    policies: {quanx: GFW, nextin: 节点选择}
  - id: apple-tv
    dlc: apple-tvplus
    quanx_compat: rule/QuantumultX/AppleTV/AppleTV.list
    quanx_merge_compat: true
    nextin_import_quanx: true
    nextin_default: false
    policies: {nextin: AppleTV}
  - id: china-sites
    dlc: []
    quanx_legacy: Rules/Region/China.list
    nextin_import_quanx: true
    nextin_default: false
    policies: {nextin: DIRECT}
  - id: overseas
    dlc: geolocation-!cn
    quanx_legacy: Rules/Region/Global.list
    nextin_default: false
    policies: {openclash: 自动选择, quanx: 自动选择, homeproxy: 自动选择, nextin: 节点选择}
