x-nextin:
  version: 1
  mode: subscription-template
proxies: []
proxy-groups:
- name: 通用分流
  type: url-test
  include-all-proxies: true
  exclude-filter: (?i)(?<![a-z0-9])(?:[x×][ \t]*[0-9]+(?:[.．][0-9]+)?|[0-9]+(?:[.．][0-9]+)?[
    \t]*[x×])(?![a-z0-9])
  url: https://www.gstatic.com/generate_204
  interval: 300
  empty-fallback: REJECT
- name: AppleTV
  type: url-test
  include-all-proxies: true
  filter: (?i)美国|美國|🇺🇸|united[ _-]+states|(?<![a-z0-9])usa?[0-9]*(?![a-z0-9])
  url: https://www.gstatic.com/generate_204
  interval: 300
  empty-fallback: REJECT
- name: OpenAI
  type: url-test
  include-all-proxies: true
  filter: (?i)^(?=.*(?:美国|美國|🇺🇸|united[ _-]+states|新加坡|狮城|獅城|🇸🇬|singapore|(?<![a-z0-9])(?:usa?|sg)[0-9]*(?![a-z0-9])))(?=.*(?<![a-z0-9])ai[0-9]*(?![a-z0-9]))
  url: https://www.gstatic.com/generate_204
  interval: 300
  empty-fallback: REJECT
- name: Apple
  type: select
  proxies:
  - DIRECT
  - 通用分流
- name: 漏网之鱼
  type: select
  proxies:
  - DIRECT
  - 通用分流
rule-providers:
  network-rules-nextin-pt:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rule_provider/network-rules-nextin-pt.yaml
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/pt.yaml
  network-rules-nextin-personal-sites:
