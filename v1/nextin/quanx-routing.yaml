rules:
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- IP-CIDR6,fe80::/10,DIRECT,no-resolve
- DOMAIN-SUFFIX,local,DIRECT
- RULE-SET,network-rules-nextin-pt,DIRECT
- RULE-SET,network-rules-nextin-personal-sites,DIRECT
- RULE-SET,network-rules-nextin-binance,通用分流
- RULE-SET,network-rules-nextin-openai,OpenAI
- RULE-SET,network-rules-nextin-apple-tv,AppleTV
- RULE-SET,network-rules-nextin-gfw,通用分流
- RULE-SET,network-rules-nextin-google,通用分流
- RULE-SET,network-rules-nextin-apple,Apple
- RULE-SET,network-rules-nextin-china-sites,DIRECT
- GEOIP,CN,DIRECT
- MATCH,漏网之鱼
