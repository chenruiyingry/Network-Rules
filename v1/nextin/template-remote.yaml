x-nextin:
  version: 1
  mode: subscription-template
proxies: []
proxy-groups:
- name: 节点选择
  type: select
  include-all-proxies: true
rule-providers:
  network-rules-nextin-pt:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-pt.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/pt.mrs
  network-rules-nextin-pt-classical:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rule_provider/network-rules-nextin-pt-classical.yaml
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/pt-classical.yaml
  network-rules-nextin-pt-ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-pt-ip.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/pt-ip.mrs
  network-rules-nextin-tiktok:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-tiktok.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/tiktok.mrs
  network-rules-nextin-binance:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-binance.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/binance.mrs
  network-rules-nextin-openai:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-openai.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/openai.mrs
  network-rules-nextin-github:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-github.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/github.mrs
  network-rules-nextin-youtube:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-youtube.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/youtube.mrs
  network-rules-nextin-telegram:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-telegram.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/telegram.mrs
  network-rules-nextin-telegram-ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-telegram-ip.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/telegram-ip.mrs
  network-rules-nextin-foreign-media:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-foreign-media.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/foreign-media.mrs
  network-rules-nextin-google:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    path: ./rule_provider/network-rules-nextin-google.mrs
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/nextin/google.mrs
