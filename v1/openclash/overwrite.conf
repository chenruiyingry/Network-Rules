[YAML]
rule-providers:
  network-rules-openai:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rule_provider/network-rules-openai.yaml
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/openclash/openai.yaml
  network-rules-github:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rule_provider/network-rules-github.yaml
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/openclash/github.yaml
  network-rules-youtube:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    path: ./rule_provider/network-rules-youtube.yaml
    url: https://raw.githubusercontent.com/chenruiyingry/Network-Rules/publish/v1/openclash/youtube.yaml
+rules:
- RULE-SET,network-rules-openai,OpenAI
- RULE-SET,network-rules-github,GitHub
- RULE-SET,network-rules-youtube,YouTube
